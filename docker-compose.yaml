x-app: &app
  image: aux:local
  build:
    context: .
    target: runtime
  init: true
  env_file:
    - path: .env.local
      required: false
  environment:
    NODE_ENV: production
    NEXT_TELEMETRY_DISABLED: "1"
    REDIS_URL: redis://redis:6379
    AUX_DATA_DIR: /app/data
  volumes:
    - aux-data:/app/data
  restart: unless-stopped

services:
  redis:
    image: redis:8.10.3-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - always
      - --maxmemory-policy
      - noeviction
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - aux-redis:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  web:
    <<: *app
    ports:
      - "127.0.0.1:${AUX_PORT:-3000}:3000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/api/health', {signal: AbortSignal.timeout(3000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    <<: *app
    command:
      [node, --conditions=react-server, --import, tsx, src/workers/playback.ts]
    depends_on:
      redis:
        condition: service_healthy
      web:
        condition: service_healthy

volumes:
  aux-redis:
  aux-data:
