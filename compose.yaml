services:
  redis:
    image: redis:7.4-alpine
    command:
      [
        redis-server,
        --appendonly,
        "yes",
        --appendfsync,
        always,
        --maxmemory-policy,
        noeviction,
      ]
    ports: ["127.0.0.1:6379:6379"]
    volumes: [aux-redis:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
volumes:
  aux-redis:
